<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />

      navigator.serviceWorker.register("/service-worker.js")

        .catch(err => console.error("❌ SW Error", err));
    }
  </script>
